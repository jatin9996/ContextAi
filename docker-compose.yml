services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contextai
      POSTGRES_PASSWORD: contextai
      POSTGRES_DB: contextai
    ports:
      # 5432 and 5433 are commonly occupied by other local Postgres containers.
      - "5434:5432"
    volumes:
      - contextai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextai -d contextai"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  contextai_pg:
